name: Progress Weekly Report Lock Tests
on:
  pull_request:
    paths:
      - 'Code.gs'
      - 'tests/progress-weekly-report-lock.test.js'
      - '.github/workflows/progress-weekly-report-lock-tests.yml'
  push:
    branches:
      - 'pms-modernization/**'
    paths:
      - 'Code.gs'
      - 'tests/progress-weekly-report-lock.test.js'
      - '.github/workflows/progress-weekly-report-lock-tests.yml'
permissions:
  contents: read
concurrency:
  group: progress-weekly-report-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  progress-weekly-report-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/progress-weekly-report-lock.test.js
