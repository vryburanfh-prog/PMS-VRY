name: Password Login Attempt Lock Tests
on:
  pull_request:
    paths:
      - 'Security.gs'
      - 'tests/password-login-attempt-lock.test.js'
      - '.github/workflows/password-login-attempt-lock-tests.yml'
  push:
    branches:
      - 'pms-modernization/**'
    paths:
      - 'Security.gs'
      - 'tests/password-login-attempt-lock.test.js'
      - '.github/workflows/password-login-attempt-lock-tests.yml'
permissions:
  contents: read
concurrency:
  group: password-login-attempt-lock-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  password-login-attempt-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/password-login-attempt-lock.test.js
