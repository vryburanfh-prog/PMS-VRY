name: PMO Snapshot Insert Integrity Tests
on:
  pull_request:
    paths:
      - 'Code.gs'
      - 'Security.gs'
      - 'tests/pmo-snapshot-insert-integrity.test.js'
      - 'tests/api-auth-coverage.test.js'
      - 'tests/pmo-snapshot-capture-runtime.test.js'
      - 'tests/database-bulk-cache-invalidation.test.js'
      - 'tests/project-delete-locking.test.js'
      - 'tests/atomic-generated-id-insert.test.js'
      - 'Database.gs'
      - '.github/workflows/pmo-snapshot-insert-integrity-tests.yml'
  push:
    branches:
      - 'pms-modernization/**'
    paths:
      - 'Code.gs'
      - 'Security.gs'
      - 'tests/pmo-snapshot-insert-integrity.test.js'
      - 'tests/api-auth-coverage.test.js'
      - 'tests/pmo-snapshot-capture-runtime.test.js'
      - 'tests/database-bulk-cache-invalidation.test.js'
      - 'tests/project-delete-locking.test.js'
      - 'Database.gs'
      - '.github/workflows/pmo-snapshot-insert-integrity-tests.yml'
permissions:
  contents: read
concurrency:
  group: pmo-snapshot-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pmo-snapshot-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/pmo-snapshot-insert-integrity.test.js tests/api-auth-coverage.test.js tests/pmo-snapshot-capture-runtime.test.js tests/database-bulk-cache-invalidation.test.js tests/project-delete-locking.test.js tests/atomic-generated-id-insert.test.js
