name: Gantt and User Event Argument Escaping Tests
on:
  pull_request:
    paths:
      - 'Presentation.html'
      - 'tests/gantt-user-event-escaping.test.js'
      - '.github/workflows/gantt-user-event-escaping-tests.yml'
  push:
    branches:
      - 'pms-modernization/**'
    paths:
      - 'Presentation.html'
      - 'tests/gantt-user-event-escaping.test.js'
      - '.github/workflows/gantt-user-event-escaping-tests.yml'
permissions:
  contents: read
concurrency:
  group: gantt-user-event-escaping-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gantt-user-event-escaping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/gantt-user-event-escaping.test.js
