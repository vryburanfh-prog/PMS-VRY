name: Project Control Record Delete Lock Tests
on:
  pull_request:
    paths:
      - 'Code.gs'
      - 'tests/project-control-delete-lock.test.js'
      - '.github/workflows/project-control-delete-lock-tests.yml'
  push:
    branches:
      - 'pms-modernization/**'
    paths:
      - 'Code.gs'
      - 'tests/project-control-delete-lock.test.js'
      - '.github/workflows/project-control-delete-lock-tests.yml'
permissions:
  contents: read
concurrency:
  group: project-control-delete-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  project-control-delete-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/project-control-delete-lock.test.js
