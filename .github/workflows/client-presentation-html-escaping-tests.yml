name: Client Presentation HTML Escaping Tests
on:
  pull_request:
    paths:
      - 'Presentation.html'
      - 'tests/client-presentation-html-escaping.test.js'
      - '.github/workflows/client-presentation-html-escaping-tests.yml'
  push:
    branches:
      - 'pms-modernization/**'
    paths:
      - 'Presentation.html'
      - 'tests/client-presentation-html-escaping.test.js'
      - '.github/workflows/client-presentation-html-escaping-tests.yml'
permissions:
  contents: read
concurrency:
  group: client-presentation-html-escaping-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client-presentation-html-escaping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/client-presentation-html-escaping.test.js
