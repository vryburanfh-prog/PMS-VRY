name: Apps Script Runtime Integration Tests

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: Apps Script test entrypoint
        required: true
        default: phase1RuntimeIntegrationTestSuite
        type: choice
        options:
          - phase1RuntimeIntegrationTestSuite

permissions:
  contents: read

concurrency:
  group: gas-runtime-integration-tests
  cancel-in-progress: false

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets
        id: secrets-check
        env:
          SCRIPT_ID: ${{ secrets.GAS_TEST_SCRIPT_ID }}
          SPREADSHEET_ID: ${{ secrets.GAS_TEST_SPREADSHEET_ID }}
          PROJECT_ID: ${{ secrets.GAS_TEST_GCP_PROJECT_ID }}
          CLASPRC: ${{ secrets.GAS_CLASPRC_JSON }}
        run: |
          if [ -z "$SCRIPT_ID" ] || [ -z "$SPREADSHEET_ID" ] || [ -z "$PROJECT_ID" ] || [ -z "$CLASPRC" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Blocked: configure GAS_TEST_SCRIPT_ID, GAS_TEST_SPREADSHEET_ID, GAS_TEST_GCP_PROJECT_ID, and GAS_CLASPRC_JSON. No Google API call was attempted."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Blocked setup notice
        if: steps.secrets-check.outputs.configured != 'true'
        run: echo "Integration setup is incomplete; this is NOT a test pass."

      - uses: actions/checkout@v4
        if: steps.secrets-check.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets-check.outputs.configured == 'true'
        with:
          node-version: 22

      - name: Configure test-only clasp target
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          SCRIPT_ID: ${{ secrets.GAS_TEST_SCRIPT_ID }}
          PROJECT_ID: ${{ secrets.GAS_TEST_GCP_PROJECT_ID }}
          CLASPRC: ${{ secrets.GAS_CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","projectId":"%s"}\n' "$SCRIPT_ID" "$PROJECT_ID" > .clasp.json
          npm install --global @google/clasp

      - name: Sync Phase 1 source and update isolated API executable
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          SCRIPT_ID: ${{ secrets.GAS_TEST_SCRIPT_ID }}
          PROJECT_ID: ${{ secrets.GAS_TEST_GCP_PROJECT_ID }}
          CLASPRC: ${{ secrets.GAS_CLASPRC_JSON }}
          DEPLOYMENT_ID_OVERRIDE: ${{ secrets.GAS_TEST_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          PROJECT_DIR="$RUNNER_TEMP/gas-test-project"
          mkdir -p "$PROJECT_DIR"
          printf '%s' "$CLASPRC" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","projectId":"%s"}\n' "$SCRIPT_ID" "$PROJECT_ID" > "$PROJECT_DIR/.clasp.json"

          # Pull the complete isolated project first so unrelated test-project files are preserved.
          cd "$PROJECT_DIR"
          clasp pull
          test -f Database.gs || { echo "::error::Isolated project did not contain Database.gs; refusing to push."; exit 1; }

          # Replace only the Phase 1 database source and runtime harness from this branch.
          cp "$GITHUB_WORKSPACE/Database.gs" "$PROJECT_DIR/Database.gs"
          cp "$GITHUB_WORKSPACE/docs/modernization/apps-script-runtime-test-harness-template.gs" "$PROJECT_DIR/Phase1RuntimeTestHarness.gs"
          grep -q "function phase1RuntimeVerifyAndCleanupDuplicateRace" "$PROJECT_DIR/Phase1RuntimeTestHarness.gs"
          grep -q "function generateNextId_" "$PROJECT_DIR/Database.gs"

          # Push the pulled project plus the two updated files to the isolated script only.
          clasp push --force

          VERSION_OUTPUT="$(clasp version "Phase 1 runtime test source ${GITHUB_SHA}")"
          echo "$VERSION_OUTPUT"
          VERSION="$(printf '%s\n' "$VERSION_OUTPUT" | sed -nE 's/.*version ([0-9]+).*/\1/p' | tail -n 1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine the newly created Apps Script version."
            exit 1
          fi

          DEPLOYMENTS="$(clasp deployments)"
          echo "$DEPLOYMENTS"
          if [ -n "$DEPLOYMENT_ID_OVERRIDE" ]; then
            TARGET_DEPLOYMENT="$DEPLOYMENT_ID_OVERRIDE"
          else
            # Prefer a deployment explicitly labelled API Executable.
            TARGET_DEPLOYMENT="$(printf '%s\n' "$DEPLOYMENTS" | awk '/API Executable/ { for (i=1; i<=NF; i++) if ($i ~ /^AKfy/) { print $i; count++ } } END { if (count != 1) exit 1 }')" || true
            if [ -z "$TARGET_DEPLOYMENT" ]; then
              # Safe fallback only when the project has exactly one deployment.
              TARGET_DEPLOYMENT="$(printf '%s\n' "$DEPLOYMENTS" | awk '/^[[:space:]]*-[[:space:]]+AKfy/ { print $2; count++ } END { if (count != 1) exit 1 }')" || true
            fi
          fi
          if [ -z "$TARGET_DEPLOYMENT" ]; then
            echo "::error::Could not uniquely identify the API Executable deployment. Add the exact deployment ID as GAS_TEST_DEPLOYMENT_ID; source has been pushed and versioned but not deployed."
            exit 1
          fi

          clasp deploy -i "$TARGET_DEPLOYMENT" -V "$VERSION" -d "Phase 1 runtime integration tests"
          echo "Updated isolated API executable deployment $TARGET_DEPLOYMENT to version $VERSION."

      - name: Run isolated Apps Script suite
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          TEST_SPREADSHEET_ID: ${{ secrets.GAS_TEST_SPREADSHEET_ID }}
          TEST_FUNCTION: ${{ inputs.test_suite || 'phase1RuntimeIntegrationTestSuite' }}
        run: |
          set -euo pipefail
          PARAMS="$(node -e 'process.stdout.write(JSON.stringify([process.env.TEST_SPREADSHEET_ID]))')"
          clasp run "$TEST_FUNCTION" --params "$PARAMS" --json | tee gas-runtime-result.json

      - name: Validate suite result is PASS
        if: steps.secrets-check.outputs.configured == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync("gas-runtime-result.json", "utf8"));
            if (result.error) throw new Error("Apps Script execution error: " + JSON.stringify(result.error));
            const payload = result.response?.result ?? result.response ?? result.result;
            if (!payload || payload.status !== "PASS") {
              throw new Error("Test entrypoint must return {status:\"PASS\"}; actual result: " + JSON.stringify(payload));
            }
            console.log("Apps Script sequential runtime suite reported PASS.");
          '

      - name: Prepare parallel duplicate-insert test
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          TEST_SPREADSHEET_ID: ${{ secrets.GAS_TEST_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          PARAMS="$(node -e 'process.stdout.write(JSON.stringify([process.env.TEST_SPREADSHEET_ID]))')"
          mkdir -p runtime-parallel-results
          clasp run phase1RuntimePrepareDuplicateRace --params "$PARAMS" --json > runtime-parallel-results/prepare.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("runtime-parallel-results/prepare.json", "utf8"));
            const p = r.response?.result ?? r.response ?? r.result;
            if (!p || p.status !== "READY") throw new Error("Parallel duplicate-race preparation failed: " + JSON.stringify(p));
          '

      - name: Run 10 parallel allocator invocations
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          TEST_SPREADSHEET_ID: ${{ secrets.GAS_TEST_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          PARAMS="$(node -e 'process.stdout.write(JSON.stringify([process.env.TEST_SPREADSHEET_ID]))')"
          pids=()
          for i in $(seq 1 10); do
            clasp run phase1RuntimeParallelAllocatorProbe --params "$PARAMS" --json > "runtime-parallel-results/allocator-$i.json" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("runtime-parallel-results").filter(x => /^allocator-\d+\.json$/.test(x));
            if (files.length !== 10) throw new Error("Expected 10 allocator responses; found " + files.length);
            const ids = files.map(f => {
              const r = JSON.parse(fs.readFileSync("runtime-parallel-results/" + f, "utf8"));
              const p = r.response?.result ?? r.response ?? r.result;
              if (!p || p.status !== "PASS" || !p.id) throw new Error("Allocator probe failed in " + f + ": " + JSON.stringify(p));
              return p.id;
            });
            if (new Set(ids).size !== 10) throw new Error("Parallel allocator returned duplicate IDs: " + JSON.stringify(ids));
            console.log("10 parallel allocator invocations returned distinct IDs: " + JSON.stringify(ids));
          '

      - name: Run 10 parallel duplicate-insert invocations
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          TEST_SPREADSHEET_ID: ${{ secrets.GAS_TEST_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          PARAMS="$(node -e 'process.stdout.write(JSON.stringify([process.env.TEST_SPREADSHEET_ID]))')"
          pids=()
          for i in $(seq 1 10); do
            clasp run phase1RuntimeDuplicateInsertProbe --params "$PARAMS" --json > "runtime-parallel-results/duplicate-$i.json" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          clasp run phase1RuntimeVerifyAndCleanupDuplicateRace --params "$PARAMS" --json > runtime-parallel-results/verify-cleanup.json
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("runtime-parallel-results").filter(x => /^duplicate-\d+\.json$/.test(x));
            if (files.length !== 10) throw new Error("Expected 10 duplicate-insert responses; found " + files.length);
            const statuses = files.map(f => {
              const r = JSON.parse(fs.readFileSync("runtime-parallel-results/" + f, "utf8"));
              const p = r.response?.result ?? r.response ?? r.result;
              if (!p || !["INSERTED", "REJECTED"].includes(p.status)) throw new Error("Duplicate probe failed in " + f + ": " + JSON.stringify(p));
              return p.status;
            });
            const inserted = statuses.filter(x => x === "INSERTED").length;
            const rejected = statuses.filter(x => x === "REJECTED").length;
            const v = JSON.parse(fs.readFileSync("runtime-parallel-results/verify-cleanup.json", "utf8"));
            const vp = v.response?.result ?? v.response ?? v.result;
            if (inserted !== 1 || rejected !== 9 || !vp || vp.status !== "PASS" || vp.retainedCount !== 1) {
              throw new Error("Parallel duplicate-insert race failed: " + JSON.stringify({inserted,rejected,verification:vp}));
            }
            console.log("Parallel duplicate-insert race passed: one insert accepted, nine rejected.");
          '

      - name: Upload runtime result
        if: always() && steps.secrets-check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-runtime-test-result
          path: |
            gas-runtime-result.json
            runtime-parallel-results/*.json
          if-no-files-found: ignore
          retention-days: 7
