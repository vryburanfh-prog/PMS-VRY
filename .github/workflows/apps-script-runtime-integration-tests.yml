name: Apps Script Runtime Integration Tests

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: Apps Script test entrypoint
        required: true
        default: phase1RuntimeIntegrationTestSuite
        type: choice
        options:
          - phase1RuntimeIntegrationTestSuite

permissions:
  contents: read

concurrency:
  group: gas-runtime-integration-tests
  cancel-in-progress: false

jobs:
  runtime-tests:
    if: ${{ secrets.GAS_TEST_SCRIPT_ID != '' && secrets.GAS_TEST_SPREADSHEET_ID != '' && secrets.GAS_CLASPRC_JSON != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure test-only clasp target
        env:
          SCRIPT_ID: ${{ secrets.GAS_TEST_SCRIPT_ID }}
          SPREADSHEET_ID: ${{ secrets.GAS_TEST_SPREADSHEET_ID }}
          CLASPRC: ${{ secrets.GAS_CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s"}\n' "$SCRIPT_ID" > .clasp.json
          npm install --global @google/clasp

      - name: Run isolated Apps Script suite
        env:
          TEST_SPREADSHEET_ID: ${{ secrets.GAS_TEST_SPREADSHEET_ID }}
          TEST_FUNCTION: ${{ inputs.test_suite }}
        run: |
          set -euo pipefail
          clasp run-function "$TEST_FUNCTION" --params "[\"$TEST_SPREADSHEET_ID\"]" --json | tee gas-runtime-result.json

      - name: Validate suite result is PASS
        run: |
          node -e '
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync("gas-runtime-result.json", "utf8"));
            if (result.error) throw new Error("Apps Script execution error: " + JSON.stringify(result.error));
            const payload = result.response?.result;
            if (!payload || payload.status !== "PASS") {
              throw new Error("Test entrypoint must return {status:\"PASS\"}; actual result: " + JSON.stringify(payload));
            }
            console.log("Apps Script test suite reported PASS.");
          '

      - name: Upload runtime result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-runtime-test-result
          path: gas-runtime-result.json
          if-no-files-found: ignore
          retention-days: 7

  missing-secrets-notice:
    if: ${{ secrets.GAS_TEST_SCRIPT_ID == '' || secrets.GAS_TEST_SPREADSHEET_ID == '' || secrets.GAS_CLASPRC_JSON == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report blocked setup
        run: |
          echo "::notice::Integration run blocked: configure GAS_TEST_SCRIPT_ID, GAS_TEST_SPREADSHEET_ID, and GAS_CLASPRC_JSON repository secrets."
          echo "No Apps Script call was made. This blocked run is not a passing test."
