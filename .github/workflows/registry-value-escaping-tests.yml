name: Registry Value and Attribute Escaping Tests
on:
  pull_request:
    paths:
      - 'Presentation.html'
      - 'tests/registry-value-escaping.test.js'
      - '.github/workflows/registry-value-escaping-tests.yml'
  push:
    branches:
      - 'pms-modernization/**'
    paths:
      - 'Presentation.html'
      - 'tests/registry-value-escaping.test.js'
      - '.github/workflows/registry-value-escaping-tests.yml'
permissions:
  contents: read
concurrency:
  group: registry-value-escaping-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  registry-value-escaping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/registry-value-escaping.test.js
