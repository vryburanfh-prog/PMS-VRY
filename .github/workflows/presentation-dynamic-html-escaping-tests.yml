name: Presentation Dynamic HTML Escaping Tests
on:
  pull_request:
    paths:
      - 'Presentation.html'
      - 'tests/presentation-dynamic-html-escaping.test.js'
      - '.github/workflows/presentation-dynamic-html-escaping-tests.yml'
  push:
    branches:
      - 'pms-modernization/**'
    paths:
      - 'Presentation.html'
      - 'tests/presentation-dynamic-html-escaping.test.js'
      - '.github/workflows/presentation-dynamic-html-escaping-tests.yml'
permissions:
  contents: read
concurrency:
  group: presentation-dynamic-html-escaping-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation-dynamic-html-escaping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/presentation-dynamic-html-escaping.test.js
