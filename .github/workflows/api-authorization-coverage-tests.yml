name: API Authorization Coverage Tests

on:
  pull_request:
    paths:
      - 'Code.gs'
      - 'Security.gs'
      - 'Presentation.html'
      - 'index.html'
      - 'tests/presentation-html-escaping.test.js'
      - 'tests/project-control-field-authorization.test.js'
      - 'tests/spreadsheet-formula-safety.test.js'
      - 'tests/google-token-validation.test.js'
      - 'tests/import-formula-preservation.test.js'
      - 'tests/index-html-escaping.test.js'
      - 'tests/api-authorization-coverage.test.js'
      - 'index.html'
      - 'tests/index-html-escaping.test.js'
      - '.github/workflows/api-authorization-coverage-tests.yml'
  push:
    paths:
      - 'Code.gs'
      - 'Security.gs'
      - 'Presentation.html'
      - 'tests/presentation-html-escaping.test.js'
      - 'tests/project-control-field-authorization.test.js'
      - 'tests/api-authorization-coverage.test.js'
      - 'index.html'
      - 'tests/index-html-escaping.test.js'
      - '.github/workflows/api-authorization-coverage-tests.yml'

jobs:
  api-authorization-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check < Code.gs
      - run: node --check < Security.gs
      - run: node --test tests/api-authorization-coverage.test.js tests/presentation-html-escaping.test.js tests/project-control-field-authorization.test.js tests/spreadsheet-formula-safety.test.js tests/google-token-validation.test.js tests/import-formula-preservation.test.js tests/index-html-escaping.test.js
