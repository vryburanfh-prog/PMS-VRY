name: User Create Lock Tests
on:
  pull_request:
    paths:
      - 'Code.gs'
      - 'tests/user-create-lock.test.js'
      - '.github/workflows/user-create-lock-tests.yml'
  push:
    branches:
      - 'pms-modernization/**'
    paths:
      - 'Code.gs'
      - 'tests/user-create-lock.test.js'
      - '.github/workflows/user-create-lock-tests.yml'
permissions:
  contents: read
concurrency:
  group: user-create-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  user-create-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/user-create-lock.test.js
