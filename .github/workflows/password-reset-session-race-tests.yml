name: Password Reset Session Race Tests
on:
  pull_request:
    paths:
      - 'Code.gs'
      - 'Security.gs'
      - 'tests/password-reset-session-race.test.js'
      - '.github/workflows/password-reset-session-race-tests.yml'
  push:
    branches:
      - 'pms-modernization/**'
    paths:
      - 'Code.gs'
      - 'Security.gs'
      - 'tests/password-reset-session-race.test.js'
      - '.github/workflows/password-reset-session-race-tests.yml'
permissions:
  contents: read
concurrency:
  group: password-reset-session-race-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  password-reset-session-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/password-reset-session-race.test.js
